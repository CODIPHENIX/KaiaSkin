services:
  mysql:
    image: mysql:8
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DB_NAME}
    healthcheck:
      test: bash -c "mysql -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD -e 'SELECT 1'"
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    ports:
      - "3308:3306"
    networks:
      - backend
    volumes:
      - mysql_data:/var/lib/mysql

  spring-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kaiaskin-api
    restart: on-failure
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - backend
    env_file:
      - .env
    volumes:
      - .env:/app/.env

networks:
  backend:
volumes:
  mysql_data:





